[project]
name = "docstore-backend"
version = "0.1.0"
description = "Secure Document Storage — backend (Flask + SQLAlchemy + Celery)"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "flask-cors==5.0.0",
    "flask-session==0.8.0",
    "flask-limiter==3.8.0",
    "gunicorn==23.0.0",

    # DB
    "sqlalchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",

    # Async
    "celery==5.6.3",
    "redis==5.1.1",

    # Storage
    "minio==7.2.20",

    # Security
    "argon2-cffi==23.1.0",
    "cryptography==43.0.1",
    "requests==2.34.2",
    "pyotp==2.10.0",  # Phase 6 — TOTP / HOTP RFC 6238/4226
    "hvac>=2.1.0,<3",  # HashiCorp Vault client

    # Config / validation
    "pydantic[email]==2.14.1",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",

    # Logging
    "structlog==24.4.0",

    # --- Phase 4: classifier ---
    # PyTorch CPU build (the +cpu wheel index is added in the Dockerfile to
    # avoid pulling a multi-GB CUDA wheel). Versions pinned to match the
    # standalone classify_sensitivity.py development environment.
    "torch==2.14.1",
    "transformers==5.20.2",
    "sentencepiece==0.2.2",
    "accelerate==1.15.0",
    # Text extraction
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "striprtf==0.0.33",
    "pyyaml==6.0.3",
    # PII detection
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-flask==1.3.0",
    "responses==0.26.3",
    "black==24.10.0",
    "ruff==0.17.1",
    "mypy==1.11.2",
    "types-redis==4.6.0.20241004",
    "types-requests==2.33.0.20261006",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --- Black ---
[tool.black]
line-length = 100
target-version = ["py312"]

# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "E501",   # line length handled by formatter
    "UP042",  # (str, Enum) -> StrEnum changes str()/format() output; migrate deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # allow assert + test passwords
"migrations/*" = ["E", "F", "I", "B", "UP", "S", "N"]

# --- MyPy ---
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
disallow_untyped_defs = false

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

# --- Coverage (Phase 16) ---
[tool.coverage.run]
branch = true
source = ["app"]
omit = [
    "app/wsgi.py",
    "app/tasks/celery_app.py",
    "app/classifier_core/*",  # ML pipeline lives in its own test module
    "migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
