# Handshake benchmark server: same image and certificate as the stack, static reply, and the pure
# MLKEM768 group added so it can be measured (the stack itself offers only the hybrid + classical groups).
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    server {
        listen 443 ssl;
        ssl_certificate     /etc/nginx/certs/selfsigned.crt;
        ssl_certificate_key /etc/nginx/certs/selfsigned.key;
        ssl_protocols       TLSv1.3;
        ssl_ecdh_curve      X25519MLKEM768:X25519:MLKEM768;
        ssl_session_tickets off;
        location / { return 204; }
    }
}
