services:
  # ── Reverse proxy (TLS termination) ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
      - "127.0.0.1:8200:8200"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      backend:
        condition: service_started
      frontend:
        condition: service_started
      vault:
        condition: service_started

  # Self-signed cert for local TLS; skipped if one already exists.
  certs:
    image: alpine:3.20
    volumes:
      - ./docker/nginx/certs:/certs
      - ./docker/nginx/generate-certs.sh:/generate-certs.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache openssl >/dev/null && sh /generate-certs.sh"]
    restart: "no"

  # ── Data stores ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    env_file:
      - .env.init
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    env_file:
      - .env.init
    command: ["sh", "-c", "redis-server --requirepass $$REDIS_PASSWORD"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env.init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
    ports:
      - "127.0.0.1:9001:9001"
    expose:
      - "9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    env_file:
      - .env.init
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_BUCKET: ${MINIO_BUCKET}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      echo 'MinIO bucket ready.'
      "

  # ── Secrets management ──────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env.init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      KEK_VERSION: ${KEK_VERSION}
    volumes:
      - ./docker/vault/init-vault.sh:/init-vault.sh:ro
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    restart: "no"

  # ── Dev tools ───────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # ── Application ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && flask --app app.wsgi run --host 0.0.0.0 --port 8000 --debug"
    env_file:
      - .env.init
    environment:
      FLASK_ENV: development
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION}
      HIBP_USER_AGENT: ${HIBP_USER_AGENT}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      LOG_LEVEL: ${LOG_LEVEL}
      EVENT_LOG_PATH: ${EVENT_LOG_PATH}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./logs:/var/log/docstore
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=1 -Q classification,av_scan,cleanup,notify,default
    # The image's HEALTHCHECK probes the HTTP server, which the worker doesn't run.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app.celery inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
    env_file:
      - .env.init
    environment:
      # Must match the backend: both derive the dev KEK the same way when KEK is empty.
      FLASK_ENV: development
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_SECURE: "false"
      HIBP_USER_AGENT: ${HIBP_USER_AGENT}
      CLASSIFIER_MULTILINGUAL: ${CLASSIFIER_MULTILINGUAL}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL}
      LOG_LEVEL: ${LOG_LEVEL}
      MAIL_SERVER: ${MAIL_SERVER}
      MAIL_PORT: ${MAIL_PORT}
      EVENT_LOG_PATH: ${EVENT_LOG_PATH}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
    volumes:
      - ./backend:/app
      - hf-cache:/cache/huggingface
      - ./logs:/var/log/docstore
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      # backend applies migrations on start
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ""
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  hf-cache:
