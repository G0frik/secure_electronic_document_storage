services:
  # ── Reverse proxy (TLS termination) ──────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
      - "80:80"
      - "8200:8200"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - vault

  # ── Data stores ──────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docstore}
      POSTGRES_DB: ${POSTGRES_DB:-docstore}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis-dev-pass}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis-dev-pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9001:9001"
    expose:
      - "9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-documents} &&
      echo 'MinIO bucket ready.'
      "

  # ── Secrets management ──────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    expose:
      - "8200"
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.15
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env.init
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID:-dev-root-token}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docstore}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-pass}
      KEK_VERSION: ${KEK_VERSION:-1}
    volumes:
      - ./docker/vault/init-vault.sh:/init-vault.sh:ro
    entrypoint: ["/bin/sh", "/init-vault.sh"]
    restart: "no"

  # ── Dev tools ───────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # ── Application ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: flask --app app.wsgi run --host 0.0.0.0 --port 8000 --debug
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docstore}:${POSTGRES_PASSWORD:-docstore}@db:5432/${POSTGRES_DB:-docstore}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-pass}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_SECURE: "false"
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      HIBP_USER_AGENT: ${HIBP_USER_AGENT:-secure-docstore-dev}
      MAIL_SERVER: mailhog
      MAIL_PORT: "1025"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      EVENT_LOG_PATH: ${EVENT_LOG_PATH:-/var/log/docstore/events.jsonl}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-app-token}
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - ./logs:/var/log/docstore
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=1 -Q classification,av_scan,cleanup,notify,default
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docstore}:${POSTGRES_PASSWORD:-docstore}@db:5432/${POSTGRES_DB:-docstore}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis-dev-pass}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_SECURE: "false"
      HIBP_USER_AGENT: ${HIBP_USER_AGENT:-secure-docstore-dev}
      CLASSIFIER_MULTILINGUAL: ${CLASSIFIER_MULTILINGUAL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MAIL_SERVER: mailhog
      MAIL_PORT: "1025"
      EVENT_LOG_PATH: ${EVENT_LOG_PATH:-/var/log/docstore/events.jsonl}
      NOTIFICATIONS_EMAIL_ENABLED: ${NOTIFICATIONS_EMAIL_ENABLED:-true}
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:-dev-app-token}
    volumes:
      - ./backend:/app
      - hf-cache:/cache/huggingface
      - ./logs:/var/log/docstore
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ""
    expose:
      - "5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  hf-cache:
