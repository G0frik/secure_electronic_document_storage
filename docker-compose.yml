services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docstore}
      POSTGRES_DB: ${POSTGRES_DB:-docstore}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a fresh volume — creates docstore_test alongside the
      # main DB. Existing volumes need `make ensure-test-db` once.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docstore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-documents} &&
      echo 'MinIO bucket ready.'
      "

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: flask --app app.wsgi run --host 0.0.0.0 --port 8000 --debug
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docstore}:${POSTGRES_PASSWORD:-docstore}@db:5432/${POSTGRES_DB:-docstore}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      KEK: ${KEK:-}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-true}
      HIBP_USER_AGENT: ${HIBP_USER_AGENT:-secure-docstore-dev}
      MAIL_SERVER: mailhog
      MAIL_PORT: "1025"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=1 -Q classification,av_scan,cleanup,notify,default
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docstore}:${POSTGRES_PASSWORD:-docstore}@db:5432/${POSTGRES_DB:-docstore}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
      MINIO_SECURE: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      KEK: ${KEK:-}
      HIBP_USER_AGENT: ${HIBP_USER_AGENT:-secure-docstore-dev}
      CLASSIFIER_MULTILINGUAL: ${CLASSIFIER_MULTILINGUAL:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
      - hf-cache:/cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
  hf-cache:
